name: collect

on:
  schedule:
    # Hourly. GitHub throttles high-frequency crons hard: */15 was honoured
    # ~5x/day. Each run polls 4x internally instead of asking for 4 starts.
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [collect]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll four times, committing after each
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            echo "--- poll $i of 4 ---"
            python src/archive_raw.py || echo "poll $i failed; continuing"
            git add data/raw/
            if ! git diff --staged --quiet; then
              git commit -m "data: archive $(date -u +'%Y-%m-%dT%H:%MZ')"
              git pull --rebase && git push || echo "push $i failed; will retry next poll"
            fi
            if [ $i -lt 4 ]; then sleep 870; fi
          done
