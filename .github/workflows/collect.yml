name: collect

on:
  schedule:
    # UTC. 05:00-22:59 UTC ~= 06:00-23:59 BST.
    # Use "*/30" instead of "*/15" if the repo stays private (Actions minutes).
    - cron: "*/15 5-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python src/archive_raw.py

      - name: Commit the archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "data: archive $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase
          git push
